name: Release

# release-please, the JS counterpart of release-plz. On every push to main it
# reads the conventional commits since the last release and opens or updates a
# release pull request with the version bump and CHANGELOG. Merging that pull
# request makes the next run tag `v<version>` and create the GitHub release,
# and the publish job then puts that version on npm.
#
# Publishing is npm TRUSTED PUBLISHING (OIDC): no npm token, no secret to
# rotate, provenance attested. npm's trusted publisher for dot.paths names this
# file, `release.yml`, in `chelonejs/dot.paths`, so keep the name. Only the
# publish job, which runs no third-party action after checkout and setup, gets
# `id-token: write`.
#
# Every action is pinned to a commit: these jobs can push tags and publish to
# npm, so a moved tag upstream must not be able to change what runs here.
#
# To retry a publish that failed after its release was created, run this
# workflow by hand: the publish job runs on workflow_dispatch and skips a
# version npm already has.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.repository == 'chelonejs/dot.paths'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0, version from package.json "packageManager"

      # No registry-url here on purpose. With it, setup-node writes an .npmrc
      # whose _authToken reads NODE_AUTH_TOKEN and exports a placeholder value
      # for that variable, so npm publishes with a dummy token and skips the
      # OIDC exchange; the registry answers 404. npm already defaults to
      # registry.npmjs.org.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # >= 22 required for OIDC; 24 LTS ships npm >= 11.5.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate the publish on the same checks as CI.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run test

      - name: Type-perf gate
        run: pnpm run typeperf:ci

      - name: Build
        run: pnpm run build

      # No NODE_AUTH_TOKEN: with `id-token: write` set, npm >= 11.5.1 exchanges
      # the GitHub OIDC token for a publish token itself and attaches
      # provenance. npm directly rather than pnpm publish, which is the shape
      # npm documents for trusted publishing; verbose logging so an exchange
      # failure (logged at verbose level only) shows up in the run.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "dot.paths@$version" version 2>/dev/null)" = "$version" ]; then
            echo "dot.paths@$version is already on npm, nothing to publish"
          else
            npm publish --provenance --access public --loglevel verbose
          fi
